<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: appka siaha aj pod výrez a spodnú lištu iPhonu -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Second Brain</title>

  <!-- Tieto riadky povedia iPhonu, že po "Pridať na plochu" je to appka (bez lišty Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brain">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0d12">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Obrazovka 1: domov (mriežka mini-appiek) -->
  <main class="screen" id="view-home">
    <header class="top">
      <p class="date" id="date">&nbsp;</p>
      <h1 id="greeting">Ahoj, Adam</h1>
      <p class="status" id="status"><span class="dot"></span><span id="status-text">Pripájam sa…</span></p>
    </header>

    <!-- Mriežka mini-appiek. Zatiaľ sú to len dlaždice, funkcie pribudnú v ďalších krokoch. -->
    <section class="grid" aria-label="Mini-appky">
      <a class="tile tile-blue" href="#terminy">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span class="name">Termíny</span>
        <span class="sub" id="next-deadline">odpočet do písomiek</span>
      </a>
      <a class="tile tile-amber" href="#bodovanie">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span class="name">Bodovanie</span>
        <span class="sub" id="points-summary">ZAP, ZIM…</span>
      </a>
      <a class="tile tile-green" href="#poznamka">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span class="name">Poznámka</span>
        <span class="sub">rýchlo do Obsidianu</span>
        <span class="badge">čoskoro</span>
      </a>
      <a class="tile tile-pink" href="#narodeniny">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M5 21v-8h14v8M12 13V9M12 5.5c.8 0 1.5-.7 1.5-1.5S12 2 12 2s-1.5 1.2-1.5 2 .7 1.5 1.5 1.5ZM5 16c2 1.5 4.7 1.5 7 0s5-1.5 7 0"/></svg>
        <span class="name">Narodeniny</span>
        <span class="sub">pripomienky blízkych</span>
        <span class="badge">čoskoro</span>
      </a>
      <a class="tile tile-violet tile-wide" href="#casnik">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-6A8 8 0 1 1 21 12Z"/><path d="M8 11h8M8 15h5"/></svg>
        <span class="name">Anglický čašník</span>
        <span class="sub">rozprávaj sa po anglicky v reštaurácii</span>
        <span class="badge">čoskoro</span>
      </a>
    </section>
  </main>

  <!-- Obrazovka 2: termíny (zobrazí sa, keď je v adrese #terminy) -->
  <main class="screen" id="view-terminy" hidden>
    <a class="back" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Domov
    </a>
    <h1>Termíny</h1>
    <p class="status" id="terminy-updated">&nbsp;</p>
    <ol class="list" id="terminy-list"></ol>
  </main>

  <!-- Obrazovka 3: bodovanie (#bodovanie) -->
  <main class="screen" id="view-bodovanie" hidden>
    <a class="back" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Domov
    </a>
    <h1>Bodovanie</h1>
    <p class="status" id="bodovanie-updated">&nbsp;</p>
    <div class="list" id="bodovanie-list"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
